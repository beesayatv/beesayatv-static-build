<style id="btf-inline-css">
.beesaya-features{
background:#fbf9f2;
border:1px solid #e8e2d2;
border-radius:10px;
padding:14px 16px;
width:min(210px,100%);
box-sizing:border-box;
}
.beesaya-features-title{
margin:0 0 14px;
font-size:1.1rem;
font-weight:700;
}
.beesaya-features-title:after{display:none!important;content:none!important;}

.beesaya-feature-row{
display:flex;
align-items:center;
gap:8px;
padding:8px 8px;
margin:2px -8px;
border-radius:8px;
text-decoration:none!important;
color:inherit;
transition:background-color .18s ease,color .18s ease;
}

.beesaya-feature-row,
.beesaya-feature-row:hover,
.beesaya-feature-row:focus,
.beesaya-feature-row:visited{
text-decoration:none!important;
}

.beesaya-feature-row:hover{
background:rgba(154,157,132,.10);
color:#4D533F;
}

.beesaya-feature-icon{
flex:0 0 24px;
text-align:center;
}

.beesaya-feature-label{
flex:1 1 auto;
min-width:0;
overflow-wrap:anywhere;
}

.beesaya-feature-count{
flex:0 0 auto;
margin-left:10px;
padding-right:2px;
font-size:.9rem;
color:#8b8b8b;
}

.beesaya-float-right{float:right;margin:0 0 22px 20px;}
.beesaya-float-left{float:left;margin:0 20px 22px 0;}
.beesaya-float-none{float:none;width:100%;max-width:420px;}

@media(max-width:768px){
.beesaya-float-right,
.beesaya-float-left,
.beesaya-float-none{
float:none;
width:100%;
max-width:none;
margin:24px 0;
}
}
/*# sourceURL=btf-inline-css */
</style>

<style>

.btv-album-card{

    display:block;
    margin:32px 0;

    border:1px solid #e4e4e4;
    border-radius:16px;

    overflow:hidden;

    background:#fff;

    color:inherit;
    text-decoration:none;

    box-shadow:0 6px 20px rgba(0,0,0,.06);

    transition:.25s;

}

.btv-album-card:hover{

    transform:translateY(-2px);

    box-shadow:0 12px 30px rgba(0,0,0,.10);

}

.btv-album-cover{

    position:relative;

    overflow:hidden;

}

.btv-album-cover img{

    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    vertical-align:top;

    transition:transform .45s ease;

}

.btv-album-card:hover img{

    transform:scale(1.03);

}

.btv-album-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:linear-gradient(
        rgba(0,0,0,.08),
        rgba(0,0,0,.22)
    );

}

.btv-album-badge{

    display:flex;

    align-items:center;

    justify-content:center;

    padding:12px 22px;

    border-radius:999px;

    background:rgba(0,0,0,.40);

    border:1px solid rgba(255,255,255,.20);

function formatDifficultyLabel(difficulty) {
    return difficulty
        ? difficulty.charAt(0).toUpperCase() + difficulty.slice(1)
        : 'Unknown';
}

function routeDifficultyProgression(trail) {
    if (!trail.segmentationEnabled || !Array.isArray(trail.segmentationPlan) || !trail.segmentationPlan.length) {
        return '';
    }

    var sequence = trail.segmentationPlan.map(function(segment) {
        return segment.difficulty;
    }).filter(Boolean).filter(function(difficulty, index, difficulties) {
        return index === 0 || difficulty !== difficulties[index - 1];
    }).map(formatDifficultyLabel);

    return sequence.join(' ' + String.fromCharCode(0x2192) + ' ');
}

function showRouteInspector(trail) {
    clearSelectedPoi();
    var difficulty = formatDifficultyLabel(trail.difficulty);
    var progression = routeDifficultyProgression(trail);
    var links = [];

    if (trail.article) {
        links.push({ href: trail.article, label: 'Trail Report' });

    if (trail.youtube) {
        links.push({ href: trail.youtube, label: 'Watch Video' });

    showAtlasInspector({
        title: trail.searchTitle || trail.title,
        description: trail.wip ? 'Status: Being Explored' : (progression ? 'Progression: ' + progression : 'Difficulty: ' + difficulty),
        links: links
    });
}

function showMotortaxiAccessNetworkForRoutes(routes, sourceId) {
    routes = Array.isArray(routes) ? routes.filter(function(route) {
        return route && route.url;
    }) : [];

    clearMotortaxiAccessNetwork();

    if (!routes.length) {
        return;
    }

    activeMotortaxiAccessPoiId = sourceId;
    var requestToken = motortaxiAccessRequestToken;
    var style = {
        pane: 'motortaxiAccessPane',
        color: '#555',
        weight: 4,
        opacity: 0.65,
        dashArray: '8 8',
        lineCap: 'round',
        lineJoin: 'round'
    };
    var casingStyle = {
        pane: 'motortaxiAccessPane',
        color: '#fff',
        weight: 7,
        opacity: atlasBasemapNeedsCasing() ? 1 : 0,
        lineCap: 'round',
        lineJoin: 'round',
        interactive: false
    };

    Promise.allSettled(routes.map(function(route) {
        if (motortaxiAccessCache.has(route.url)) {
            return Promise.resolve({ route: route, data: motortaxiAccessCache.get(route.url) });
        }

        return fetch(route.url)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Unable to load motortaxi access route.');
                }
                return response.json();
            })
            .then(function(data) {
                motortaxiAccessCache.set(route.url, data);
                return { route: route, data: data };
            });
    })).then(function(results) {
        if (requestToken !== motortaxiAccessRequestToken || activeMotortaxiAccessPoiId !== sourceId) {
            return;
        }

        results.forEach(function(result) {
            if (result.status === 'fulfilled') {
                L.geoJSON(result.value.data, {
                    style: casingStyle,
                    interactive: false,
                    filter: function(feature) {
                        return !!(feature.geometry && (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString'));
                    }
                }).addTo(motortaxiAccessCasingLayer);
                L.geoJSON(result.value.data, {
                    style: style,
                    interactive: !!result.value.route.editUrl,
                    onEachFeature: function(feature, accessLine) {
                        bindHabalRouteAdminPopup(accessLine, result.value.route);
                    },
                    filter: function(feature) {
                        return !!(feature.geometry && (feature.geometry.type === 'LineString' || feature.geometry.type === 'MultiLineString'));
                    }
                }).addTo(motortaxiAccessNetworkLayer);
            }
        });
        updateAtlasBasemapVisuals();
    });
}

function routePoints(layer) {
    var points = [];

    function collectPoints(currentLayer) {
        if (currentLayer.getLatLngs) {
            var latLngs = currentLayer.getLatLngs();
            var flatten = function(items) {
                items.forEach(function(item) {
                    if (Array.isArray(item)) {
                        flatten(item);
                    } else if (item && typeof item.lat === 'number' && typeof item.lng === 'number') {
                        points.push(item);
                    }
                });
            };
            flatten(latLngs);
        } else if (currentLayer.eachLayer) {
            currentLayer.eachLayer(collectPoints);
        }
    }

    collectPoints(layer);
    return points;
}

        : '\x3Cpath d="M7 21V3" stroke="#F5F2E8" stroke-width="2.5" stroke-linecap="round"/>\x3Cpath d="M8 4h10l-2.5 4L18 12H8z" fill="#B83C3C" stroke="#F5F2E8" stroke-width="1.5" stroke-linejoin="round"/>';

    return L.divIcon({

            (isStart ? '\x3Cspan class="btv-route-endpoint__label" style="' + labelTranslate + '">Started here\x3C/span>' : ''),
        iconSize: [size, size],

function routeEndpointOffsets(points) {
    var start = points[0];
    var finish = points[points.length - 1];
    var startPixel = map.latLngToContainerPoint(start);
    var finishPixel = map.latLngToContainerPoint(finish);
    var minimumSeparation = routeEndpointSize() * 0.8;

    if (startPixel.distanceTo(finishPixel) >= minimumSeparation || points.length < 2) {
        return { start: null, finish: null };
    }

    // Loop start/end points can be identical. Split the icons across the first route segment.
    var nextPoint = points.find(function(point) {
        return point.lat !== start.lat || point.lng !== start.lng;
    });
    var nextPixel = nextPoint ? map.latLngToContainerPoint(nextPoint) : L.point(1, 0);
    var dx = nextPixel.x - startPixel.x;
    var dy = nextPixel.y - startPixel.y;
    var length = Math.sqrt(dx * dx + dy * dy) || 1;
    var gap = Math.round(routeEndpointSize() * 0.32);
    var perpendicular = { x: (-dy / length) * gap, y: (dx / length) * gap };

    return {
        start: { x: -perpendicular.x, y: -perpendicular.y },
        finish: perpendicular
    };
}

function chevronOverlapsVisiblePoi(latLng) {
    var chevronPoint = map.latLngToContainerPoint(latLng);
    var visibleClusters = {};

    return poiMarkers.some(function(marker) {
        var poi = marker._atlasPoi;

        if (poi && poi.category === 'motortaxi' && poi.parent_category !== 'context' && typeof motortaxiClusterLayer.getVisibleParent === 'function') {
            var visibleParent = motortaxiClusterLayer.getVisibleParent(marker);

            if (!visibleParent || !map.hasLayer(visibleParent)) {
                return false;
            }

            if (visibleParent !== marker) {
                var clusterId = L.stamp(visibleParent);

                if (visibleClusters[clusterId]) {
                    return false;
                }

                visibleClusters[clusterId] = true;
                return chevronPoint.distanceTo(map.latLngToContainerPoint(visibleParent.getLatLng())) < 23;
            }
        }

        if (!map.hasLayer(marker)) {
            return false;
        }

        var poiRadius = poi && poi.parent_category === 'context' ? 11 : 15;
        return chevronPoint.distanceTo(map.latLngToContainerPoint(marker.getLatLng())) < poiRadius + 7;
    });
}

function showRouteChevrons(trail) {
    routeChevronMarkers.clearLayers();

    function addChevronsAlongLine(latLngs, color) {
        if (!latLngs || !latLngs.length) {
            return;
        }

        if (Array.isArray(latLngs[0])) {
            latLngs.forEach(function(line) {
                addChevronsAlongLine(line, color);
            });
            return;
        }

        if (latLngs.length < 2) {
            return;
        }

        var spacing = 110;
        var travelled = 0;
        var nextChevron = spacing / 2;

        for (var pointIndex = 1; pointIndex < latLngs.length; pointIndex++) {
            var previousPixel = map.latLngToContainerPoint(latLngs[pointIndex - 1]);
            var currentPixel = map.latLngToContainerPoint(latLngs[pointIndex]);
            var dx = currentPixel.x - previousPixel.x;
            var dy = currentPixel.y - previousPixel.y;
            var segmentLength = Math.sqrt(dx * dx + dy * dy);

            if (!segmentLength) {
                continue;
            }

            while (travelled + segmentLength >= nextChevron) {
                var ratio = (nextChevron - travelled) / segmentLength;
                var chevronPosition = L.latLng(
                    latLngs[pointIndex - 1].lat + (latLngs[pointIndex].lat - latLngs[pointIndex - 1].lat) * ratio,
                    latLngs[pointIndex - 1].lng + (latLngs[pointIndex].lng - latLngs[pointIndex - 1].lng) * ratio
                );
                var chevronAngle = Math.atan2(dy, dx) * 180 / Math.PI;

                if (chevronOverlapsVisiblePoi(chevronPosition)) {
                    nextChevron += spacing;
                    continue;
                }

                L.marker(chevronPosition, {
                    icon: routeChevronIcon(color, chevronAngle),
                    interactive: false,
                    keyboard: false,
                    zIndexOffset: 900
                }).addTo(routeChevronMarkers);

                nextChevron += spacing;
            }

            travelled += segmentLength;
        }
    }

    routePolylineLayers(trail.layer, function(lineLayer) {
        addChevronsAlongLine(
            lineLayer.getLatLngs(),
            lineLayer.options.color || getTrailColor(trail.difficulty)
        );
    });
}

var search = document.getElementById("trail-search");
var searchSubmit = document.getElementById("trail-search-submit");
var searchResults = document.getElementById("trail-search-results");
var searchTimer;
var activeResultIndex = -1;

function matchingTrails(query) {
    var normalizedQuery = query.trim().toLowerCase();

    if (!normalizedQuery) {
        return [];
    }

    return Object.keys(trailLayers).map(function(slug) {
        return trailLayers[slug];
    }).filter(function(trail) {
        return trail.slug.toLowerCase().includes(normalizedQuery) || trail.title.toLowerCase().includes(normalizedQuery);
    }).sort(function(a, b) {
        var aExact = a.title.toLowerCase() === normalizedQuery || a.slug.toLowerCase() === normalizedQuery;
        var bExact = b.title.toLowerCase() === normalizedQuery || b.slug.toLowerCase() === normalizedQuery;
        return Number(bExact) - Number(aExact) || a.title.localeCompare(b.title);
    });
}

function closeSearchResults() {
    searchResults.hidden = true;
    searchResults.replaceChildren();
    activeResultIndex = -1;
    search.setAttribute('aria-activedescendant', '');
}

function focusTrail(trail) {
    setRouteFocus(trail);
    var mobilePadding = window.matchMedia('(max-width: 640px)').matches;
    map.fitBounds(trail.layer.getBounds(), {
        paddingTopLeft: mobilePadding ? [20, 20] : [30, 30],
        paddingBottomRight: mobilePadding ? [20, 150] : [30, 125]
    });

    window.setTimeout(function() {
        showSelectedTrailDetails(trail);
        showRouteInspector(trail);
    }, 250);
}

function selectTrail(trail) {
    closeSearchResults();
    search.value = trail.searchTitle || trail.title;
    focusTrail(trail);
}

function renderSearchResults() {
    var query = search.value.trim();
    var matches = matchingTrails(query);

    searchResults.replaceChildren();
    activeResultIndex = -1;
    search.setAttribute('aria-activedescendant', '');

    if (!query) {
        closeSearchResults();
        return;
    }

    if (!matches.length) {
        var emptyState = document.createElement('div');
        emptyState.className = 'trail-search-results__empty';
        emptyState.textContent = 'No matching trails';
        searchResults.appendChild(emptyState);
        searchResults.hidden = false;
        return;
    }

    matches.slice(0, 5).forEach(function(trail, index) {
        var result = document.createElement('button');
        var title = document.createElement('span');
        var difficulty = document.createElement('span');

        result.type = 'button';
        result.className = 'trail-search-results__item';
        result.id = 'trail-search-result-' + index;
        result.setAttribute('role', 'option');
        result.setAttribute('aria-selected', 'false');
        title.className = 'trail-search-results__title';
        title.textContent = trail.searchTitle || trail.title;
        difficulty.className = 'trail-search-results__difficulty';
        difficulty.textContent = trail.difficulty || 'Unknown';
        result.append(title, difficulty);
        result.addEventListener('click', function() {
            selectTrail(trail);
        });
        searchResults.appendChild(result);
    });

    searchResults.hidden = false;
}

function setActiveResult(index) {
    var items = searchResults.querySelectorAll('.trail-search-results__item');

    if (!items.length) {
        return;
    }

    activeResultIndex = (index + items.length) % items.length;
    items.forEach(function(item, itemIndex) {
        item.classList.toggle('is-active', itemIndex === activeResultIndex);
        item.setAttribute('aria-selected', itemIndex === activeResultIndex ? 'true' : 'false');
    });
    search.setAttribute('aria-activedescendant', items[activeResultIndex].id);
    items[activeResultIndex].scrollIntoView({ block: 'nearest' });
}

function submitSearch() {
    var matches = matchingTrails(search.value);

    if (matches.length === 1) {
        selectTrail(matches[0]);
        return;
    }

    renderSearchResults();
}

search.addEventListener('input', function() {
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(renderSearchResults, 225);
});

search.addEventListener('focus', function() {
    if (search.value.trim()) {
        renderSearchResults();
    }
});

search.addEventListener("keydown", function(e){
    if (e.key === 'ArrowDown' && !searchResults.hidden) {
        e.preventDefault();
        setActiveResult(activeResultIndex + 1);
    } else if (e.key === 'ArrowUp' && !searchResults.hidden) {
        e.preventDefault();
        setActiveResult(activeResultIndex - 1);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        var items = searchResults.querySelectorAll('.trail-search-results__item');
        if (activeResultIndex >= 0 && items[activeResultIndex]) {
            items[activeResultIndex].click();
        } else {
            submitSearch();
        }
    } else if (e.key === 'Escape') {
        closeSearchResults();
    }
});

searchSubmit.addEventListener('click', submitSearch);

document.addEventListener('pointerdown', function(e) {
    if (!e.target.closest('.beesayatv-atlas-search')) {
        closeSearchResults();
    }
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && atlasContainer.classList.contains('is-fullscreen')) {
        e.preventDefault();
        toggleAtlasFullscreen(false);
        fullscreenButton.focus();
    }
});

map.on('click dragstart zoomstart', closeSearchResults);
map.on('click', function() {
    clearRouteFocus();
    closeAtlasInspector();
});
map.on('dragstart', closeAtlasInspector);
map.on('zoomend', refreshSelectedTrailDetails);
